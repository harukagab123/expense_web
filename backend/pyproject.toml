[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-financial-file-manager-backend"
version = "0.1.0"
description = "FastAPI backend for a single-user personal financial file manager."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.95,<0.100",
    "pydantic>=1.10,<2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.23,<0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24,<0.25",
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
